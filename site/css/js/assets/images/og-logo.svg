<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="55%" stop-color="#161b27"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="rgba(181,142,90,0.22)"/>
      <stop offset="100%" stop-color="rgba(181,142,90,0)"/>
    </radialGradient>
    <radialGradient id="glowBl" cx="12%" cy="92%" r="42%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4ad6f"/>
      <stop offset="100%" stop-color="#b58e5a"/>
    </linearGradient>
  </defs>

  <!-- Base + warm radial glows -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glowBl)"/>

  <!-- Top + bottom hairlines -->
  <rect x="0" y="0" width="1200" height="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="0" y="629" width="1200" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- Centered composition -->
  <!-- Monogram tile (top, centered) -->
  <g transform="translate(510 110)">
    <rect width="180" height="180" rx="34" ry="34" fill="#1f2535"
          stroke="rgba(212,173,111,0.30)" stroke-width="1.5"/>
    <g transform="translate(36 36)" fill="url(#mark)">
      <path d="M 0 108 L 0 0 L 24 0 L 54 66 L 84 0 L 108 0 L 108 108 L 88.5 108 L 88.5 36 L 63 90 L 45 90 L 19.5 36 L 19.5 108 Z"/>
    </g>
  </g>

  <!-- Wordmark (centered horizontally) -->
  <text x="600" y="380"
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-weight="500" font-size="86" fill="#ffffff" letter-spacing="-1.2">MLP Reno &amp; Design</text>

  <!-- Copper accent line -->
  <rect x="555" y="416" width="90" height="2" fill="#b58e5a"/>

  <!-- Tagline -->
  <text x="600" y="470"
        text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="400" font-size="22" fill="#a8aebd" letter-spacing="4">RÉNOVATION RÉSIDENTIELLE · MONTRÉAL</text>

  <!-- Footer: small RBQ note -->
  <text x="600" y="555"
        text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="500" font-size="14" fill="rgba(181,142,90,0.78)" letter-spacing="3">ENTREPRENEUR GÉNÉRAL CERTIFIÉ RBQ</text>
</svg>
