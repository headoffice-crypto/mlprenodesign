<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM · Leads — MLP</title>
  <link rel="stylesheet" href="/event/event.css">
  <style>
    .goal {
      padding: 20px 24px; background: #fff; border-radius: 14px; border: 1px solid rgba(26,18,8,.08);
      box-shadow: 0 4px 18px -8px rgba(26,18,8,.15);
      margin-bottom: 28px;
    }
    .goal-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .goal-row .big   { font-family: var(--serif); font-size: 2.6rem; line-height: 1; color: var(--terra); }
    .goal-row .big strong { color: var(--terra); }
    .goal-row .goal-l { color: #5b4a2b; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    .goal-bar { height: 8px; background: rgba(26,18,8,.08); border-radius: 999px; overflow: hidden; margin-top: 14px; }
    .goal-bar > div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--terra)); transition: width .4s ease; }

    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 18px; align-items: center; }
    .lead-tbl { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 22px -10px rgba(26,18,8,.18); }
    .lead-tbl th, .lead-tbl td { padding: 14px; text-align: left; vertical-align: top; border-bottom: 1px solid rgba(26,18,8,.06); font-size: 14px; }
    .lead-tbl th { background: #f0ead9; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5b4a2b; }
    .lead-tbl tr:last-child td { border-bottom: 0; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; background: #f0ead9; color: #5b4a2b; }
    .prize-pill { background: rgba(200,167,102,.18); color: #7a5a1c; font-weight: 700; }

    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .row-actions button {
      background: transparent; border: 1px solid rgba(26,18,8,.12);
      padding: 6px 10px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
      color: #5b4a2b; font-size: 12px;
    }
    .row-actions button:hover { border-color: var(--gold); color: var(--terra); }
    .row-actions .danger:hover { border-color: #c84444; color: #c84444; }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(26,18,8,.55);
      display: none; place-items: center; z-index: 100;
      padding: 5vh 5vw; overflow: auto;
    }
    .modal-bg.is-open { display: grid; }
    .modal {
      background: #fff; color: #1a1208;
      max-width: 540px; width: 100%;
      border-radius: 16px; padding: 28px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,.4);
    }
    .modal h2 { font-family: var(--serif); font-size: 1.5rem; margin: 0 0 18px; }
    .modal .ev-field { margin-bottom: 14px; }
    .modal .ev-label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5b4a2b; margin-bottom: 6px; }
    .modal .ev-input, .modal .ev-select {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1.5px solid rgba(26,18,8,.15); border-radius: 8px;
      background: #fff; color: #1a1208; font-family: inherit;
    }
    .modal .ev-input:focus, .modal .ev-select:focus { outline: none; border-color: var(--gold); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .modal-actions .spacer { flex: 1; }
    .modal-error { color: #c84444; font-size: 13px; margin-top: 8px; min-height: 18px; }
  </style>
</head>
<body class="theme-light">
  <div id="header"></div>

  <main class="ev-wrap ev-section">
    <h1 class="ev-h1">Leads</h1>

    <!-- 100-lead goal tracker -->
    <section class="goal mt-4">
      <div class="goal-row">
        <div>
          <div class="big"><strong id="goal-count">0</strong> <span style="color:#5b4a2b;">/ <span id="goal-target">100</span></span></div>
          <div class="goal-l">Objectif de leads</div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:var(--serif);font-size:1.6rem;color:#1a1208;" id="goal-pct">0&nbsp;%</div>
          <div class="goal-l" id="goal-remaining">100 restants</div>
        </div>
      </div>
      <div class="goal-bar"><div id="goal-bar-fill" style="width:0%;"></div></div>
    </section>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <input id="search" class="ev-input" placeholder="Rechercher nom, téléphone, courriel…" style="max-width:340px;">
      <select id="filter-segment" class="ev-select" style="max-width:180px;"><option value="">Tous profils</option></select>
      <select id="filter-region" class="ev-select" style="max-width:180px;"><option value="">Toutes régions</option></select>
      <span style="flex:1"></span>
      <button class="ev-btn ev-btn-outline" id="btn-export">Exporter CSV</button>
      <button class="ev-btn ev-btn-ghost" id="btn-wipe" style="color:#7a1c1c;">Réinitialiser</button>
    </div>

    <div style="overflow-x:auto;">
      <table class="lead-tbl">
        <thead><tr>
          <th>Nom</th><th>Contact</th><th>Profil</th><th>Région</th><th>Cadeau ciblé</th><th>Date</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="hidden mt-8" style="color:#5b4a2b;text-align:center;">Aucun lead pour l'instant.</p>

    <div class="ev-divider"></div>
    <div class="row">
      <a href="/event-dashboard" class="ev-btn ev-btn-outline">← Tableau de bord</a>
      <a href="/presentation-live" class="ev-btn ev-btn-ghost" target="_blank">Présentation principale</a>
    </div>
  </main>

  <!-- Edit modal -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h2 id="modal-title">Modifier le lead</h2>
      <input type="hidden" id="m-customerId">
      <input type="hidden" id="m-leadId">
      <div class="ev-field">
        <label class="ev-label" for="m-name">Nom *</label>
        <input class="ev-input" id="m-name" required>
      </div>
      <div class="ev-field">
        <label class="ev-label" for="m-phone">Téléphone</label>
        <input class="ev-input" id="m-phone" type="tel">
      </div>
      <div class="ev-field">
        <label class="ev-label" for="m-email">Courriel</label>
        <input class="ev-input" id="m-email" type="email">
      </div>
      <div class="ev-field">
        <label class="ev-label" for="m-segment">Profil</label>
        <select class="ev-select" id="m-segment"></select>
      </div>
      <div class="ev-field">
        <label class="ev-label" for="m-region">Région</label>
        <select class="ev-select" id="m-region"></select>
      </div>
      <div class="modal-error" id="m-error"></div>
      <div class="modal-actions">
        <button class="ev-btn ev-btn-ghost" id="m-cancel" type="button">Annuler</button>
        <span class="spacer"></span>
        <button class="ev-btn ev-btn-primary" id="m-save" type="button">Enregistrer</button>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="/event/icons.js"></script>
  <script src="/event/event.js"></script>
  <script>
    document.getElementById('header').innerHTML = MLP_EVENT.renderHeader({ tag: 'CRM · Leads', operator: true });
    document.getElementById('footer').innerHTML = MLP_EVENT.renderFooter();
    const ic = (n, s) => MLP_ICONS.svg(n, { size: s || 14 });

    // Populate filters
    const segFilter = document.getElementById('filter-segment');
    Object.entries(MLP_EVENT.SEGMENTS).forEach(([k,s]) => {
      const o = document.createElement('option'); o.value = k; o.textContent = s.label;
      segFilter.appendChild(o);
    });
    const regFilter = document.getElementById('filter-region');
    Object.entries(MLP_EVENT.REGIONS).forEach(([k,r]) => {
      const o = document.createElement('option'); o.value = k; o.textContent = r.label;
      regFilter.appendChild(o);
    });

    function fmtDate(iso) { return new Date(iso).toLocaleString('fr-CA', { dateStyle:'short', timeStyle:'short' }); }

    function renderGoal(leads) {
      const goal = MLP_EVENT.LEAD_GOAL || 100;
      const n = leads.length;
      const pct = Math.min(100, Math.round((n / goal) * 100));
      document.getElementById('goal-count').textContent  = n;
      document.getElementById('goal-target').textContent = goal;
      document.getElementById('goal-pct').textContent    = pct + ' %';
      document.getElementById('goal-remaining').textContent = Math.max(0, goal - n) + ' restants';
      document.getElementById('goal-bar-fill').style.width = pct + '%';
    }

    // Cache the remote leads here so re-renders don't have to refetch.
    let remoteLeads = [];
    let remoteError = null;

    async function refreshRemote() {
      try {
        remoteLeads = await MLP_EVENT.fetchEventLeads();
        remoteError = null;
      } catch (e) {
        remoteError = e.message || String(e);
      }
      render();
    }

    // Merge local + remote, keyed by lead id, remote takes precedence.
    function mergedLeads() {
      const map = new Map();
      MLP_EVENT.getLeads().forEach(l => map.set(l.id, l));
      remoteLeads.forEach(l => map.set(l.id, Object.assign({}, map.get(l.id) || {}, l)));
      return Array.from(map.values());
    }

    function render() {
      const all = mergedLeads();
      renderGoal(all);
      const q = document.getElementById('search').value.trim().toLowerCase();
      const fSeg = document.getElementById('filter-segment').value;
      const fReg = document.getElementById('filter-region').value;

      const filtered = all.filter(l => {
        if (q) {
          const blob = [l.name,l.email,l.phone,l.city].join(' ').toLowerCase();
          if (blob.indexOf(q) === -1) return false;
        }
        if (fSeg && l.segment !== fSeg) return false;
        if (fReg && l.region  !== fReg) return false;
        return true;
      }).sort((a,b) => b.createdAt.localeCompare(a.createdAt));

      const rows = document.getElementById('rows');
      const empty = document.getElementById('empty');
      if (filtered.length === 0) { rows.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');

      rows.innerHTML = filtered.map(l => {
        const seg = MLP_EVENT.SEGMENTS[l.segment] || {};
        const reg = MLP_EVENT.REGIONS[l.region]   || {};
        const g   = MLP_EVENT.GIVEAWAYS[l.giveawayKey] || {};
        const localOnly = !l.customerId;
        const localTag = localOnly ? ' <span style="color:#9aa0a6;font-size:11px;font-weight:400;">· local</span>' : '';
        return `<tr data-id="${l.id}">
          <td><strong>${l.name || '—'}</strong>${localTag}</td>
          <td><div>${l.phone || ''}</div><div style="color:#5b4a2b;font-size:12px;">${l.email || ''}</div></td>
          <td><span class="pill">${seg.icon ? ic(seg.icon, 14) : ''} ${seg.label || l.segment || '—'}</span></td>
          <td><span class="pill">${ic('mapPin', 14)} ${reg.label || '—'}</span></td>
          <td><span class="pill prize-pill">${ic('gift', 14)} ${g.short || '—'} · ${g.value || 0}&nbsp;$</span></td>
          <td><span style="font-size:12px;color:#5b4a2b;">${fmtDate(l.createdAt)}</span></td>
          <td>
            <div class="row-actions">
              <button data-edit="${l.id}">${ic('edit', 12)} Modifier</button>
              <button class="danger" data-del="${l.id}">${ic('trash', 12)} Supprimer</button>
            </div>
          </td>
        </tr>`;
      }).join('');

      // Attach handlers
      rows.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.edit)));
      rows.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => confirmDelete(b.dataset.del)));
    }

    /* ---------- Edit + Delete ---------- */

    function leadById(id) { return mergedLeads().find(l => l.id === id); }

    function populateModalSelectors() {
      const segSel = document.getElementById('m-segment');
      segSel.innerHTML = '';
      Object.entries(MLP_EVENT.SEGMENTS).forEach(([k, s]) => {
        const o = document.createElement('option'); o.value = k; o.textContent = s.label;
        segSel.appendChild(o);
      });
      const regSel = document.getElementById('m-region');
      regSel.innerHTML = '';
      Object.entries(MLP_EVENT.REGIONS).forEach(([k, r]) => {
        const o = document.createElement('option'); o.value = k; o.textContent = r.label;
        regSel.appendChild(o);
      });
    }
    populateModalSelectors();

    function openEdit(leadId) {
      const lead = leadById(leadId);
      if (!lead) return;
      document.getElementById('m-leadId').value     = lead.id;
      document.getElementById('m-customerId').value = lead.customerId || '';
      document.getElementById('m-name').value       = lead.name  || '';
      document.getElementById('m-phone').value      = lead.phone || '';
      document.getElementById('m-email').value      = lead.email || '';
      document.getElementById('m-segment').value    = lead.segment || 'proprietaire';
      document.getElementById('m-region').value     = lead.region  || 'montreal';
      document.getElementById('m-error').textContent = '';
      document.getElementById('modal-bg').classList.add('is-open');
      document.getElementById('m-name').focus();
    }

    function closeModal() {
      document.getElementById('modal-bg').classList.remove('is-open');
    }
    document.getElementById('m-cancel').onclick = closeModal;
    document.getElementById('modal-bg').addEventListener('click', e => {
      if (e.target.id === 'modal-bg') closeModal();
    });

    document.getElementById('m-save').onclick = async () => {
      const leadId     = document.getElementById('m-leadId').value;
      const customerId = document.getElementById('m-customerId').value;
      const lead       = leadById(leadId);
      if (!lead) return;

      const segmentKey = document.getElementById('m-segment').value;
      const regionKey  = document.getElementById('m-region').value;
      const segment = MLP_EVENT.SEGMENTS[segmentKey] || {};
      const region  = MLP_EVENT.REGIONS[regionKey]   || {};
      const giveawayKey   = segment.primaryPrize || lead.giveawayKey || '';
      const giveaway      = MLP_EVENT.GIVEAWAYS[giveawayKey] || {};

      const updatedLead = Object.assign({}, lead, {
        name:         document.getElementById('m-name').value.trim(),
        phone:        document.getElementById('m-phone').value.trim(),
        email:        document.getElementById('m-email').value.trim(),
        segment:      segmentKey,
        segmentLabel: segment.label || '',
        region:       regionKey,
        regionLabel:  region.label || '',
        giveawayKey,
        giveawayTitle: giveaway.title || '',
        giveawayValue: giveaway.value || 0,
      });

      if (!updatedLead.name) {
        document.getElementById('m-error').textContent = 'Le nom est requis.';
        return;
      }

      const saveBtn = document.getElementById('m-save');
      saveBtn.disabled = true; saveBtn.textContent = 'Enregistrement…';
      try {
        if (customerId) {
          await MLP_EVENT.updateEventLead(customerId, updatedLead);
        }
        MLP_EVENT.updateLead(leadId, updatedLead); // also patch localStorage copy
        closeModal();
        await refreshRemote();
      } catch (e) {
        document.getElementById('m-error').textContent = e.message || String(e);
      } finally {
        saveBtn.disabled = false; saveBtn.textContent = 'Enregistrer';
      }
    };

    async function confirmDelete(leadId) {
      const lead = leadById(leadId);
      if (!lead) return;
      if (!confirm(`Supprimer le lead "${lead.name || '—'}"? Cette action est irréversible.`)) return;
      try {
        if (lead.customerId) {
          await MLP_EVENT.deleteEventLead(lead.customerId);
        }
        MLP_EVENT.deleteLead(leadId);  // always clear from localStorage too
        await refreshRemote();
        render();
      } catch (e) {
        alert('Erreur — ' + (e.message || String(e)));
      }
    }

    ['search','filter-segment','filter-region'].forEach(id => {
      document.getElementById(id).addEventListener('input', render);
      document.getElementById(id).addEventListener('change', render);
    });
    document.getElementById('btn-export').onclick = MLP_EVENT.exportCSV;
    document.getElementById('btn-wipe').onclick = () => {
      if (!confirm('Effacer TOUS les leads?')) return;
      if (!confirm('Vraiment? Cette action est irréversible.')) return;
      MLP_EVENT.wipeAll(); render();
    };

    render();
    refreshRemote();                       // initial fetch from Supabase
    setInterval(refreshRemote, 8000);      // and poll every 8s
  </script>
</body>
</html>
