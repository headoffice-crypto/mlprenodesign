<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic — MLP</title>
  <link rel="stylesheet" href="/event/event.css">
  <style>
    html, body { min-height: 100vh; }
    body { display: flex; flex-direction: column; }

    main.diag {
      max-width: 1100px; width: 100%; margin: 0 auto;
      padding: 80px 24px 32px;
    }

    .diag-h1 {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 4.2vw, 3.6rem);
      line-height: 1.1; margin: 0 0 48px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
    }
    @media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }

    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px;
      padding: 48px 32px;
      background: var(--bg-soft);
      border: 1.5px solid var(--line);
      border-radius: 20px;
      color: var(--ink); text-decoration: none;
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
      min-height: 260px;
      text-align: center;
    }
    .card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      background: rgba(200,167,102,0.05);
    }
    .card-icon {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--gold), var(--terra));
      display: grid; place-items: center;
      color: #1a1208;
    }
    .card-icon .icon { width: 32px; height: 32px; }
    .card h2 {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 2.2vw, 2.2rem);
      margin: 0; line-height: 1.1;
    }
    .card-arrow { color: var(--gold); display: grid; place-items: center; }
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="diag">
    <h1 class="diag-h1">Vous êtes…</h1>

    <div class="cards" id="cards"></div>
  </main>

  <div id="footer"></div>

  <script src="/event/icons.js"></script>
  <script src="/event/event.js"></script>
  <script>
    document.getElementById('header').innerHTML = MLP_EVENT.renderHeader({});
    document.getElementById('footer').innerHTML = MLP_EVENT.renderFooter();

    const LABEL = {
      proprietaire: 'Propriétaire',
      acheteur:     'Acheteur',
      investisseur: 'Investisseur',
    };

    const cards = document.getElementById('cards');
    Object.entries(MLP_EVENT.SEGMENTS).forEach(([k, s]) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = s.presentation + '?seg=' + k;
      a.innerHTML = `
        <div class="card-icon">${MLP_ICONS.svg(s.icon, { size: 32 })}</div>
        <h2>${LABEL[k] || k}</h2>
        <div class="card-arrow">${MLP_ICONS.svg('arrowRight', { size: 24 })}</div>`;
      a.addEventListener('click', () => {
        MLP_EVENT.setSegment(k);
        MLP_EVENT.trackStep('diagnostic-' + k);
      });
      cards.appendChild(a);
    });

    MLP_EVENT.trackStep('diagnostic-view');
  </script>
</body>
</html>
