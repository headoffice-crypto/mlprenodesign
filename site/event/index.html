<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participez au tirage — MLP</title>
  <link rel="stylesheet" href="/event/event.css">
  <style>
    .seg-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    @media (max-width: 600px) { .seg-picker { grid-template-columns: 1fr; } }
    .seg-picker label {
      cursor: pointer;
      padding: 14px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: rgba(255,255,255,.02);
      text-align: center;
      transition: border-color .15s ease, background .15s ease;
    }
    .seg-picker label:hover { border-color: rgba(200,167,102,.4); }
    .seg-picker input { position: absolute; opacity: 0; pointer-events: none; }
    .seg-picker .ic   { display: grid; place-items: center; width: 36px; height: 36px; margin: 0 auto 6px; border-radius: 10px; background: rgba(200,167,102,0.10); color: var(--gold); }
    .seg-picker input:checked + .pad .ic { background: var(--gold); color: #1a1208; }
    .seg-picker .ic .icon { width: 22px; height: 22px; }
    .seg-picker .lbl  { font-weight: 700; font-size: 14px; }
    .seg-picker input:checked + .pad { border-color: var(--gold); background: rgba(200,167,102,.1); }
    .seg-picker .pad { display: block; padding: 10px; border-radius: 10px; border: 1.5px solid transparent; transition: all .15s ease; }
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="ev-wrap ev-section">

    <div id="form-view" style="max-width:520px;margin:0 auto;">
      <h1 class="ev-h1 center">Participez au tirage.</h1>

      <form class="ev-card ev-form mt-8" id="lead-form" autocomplete="on">
        <div class="seg-picker" id="seg-picker"></div>

        <div class="ev-field">
          <label class="ev-label" for="name">Nom *</label>
          <input class="ev-input" id="name" name="name" required>
        </div>
        <div class="ev-field">
          <label class="ev-label" for="phone">Téléphone *</label>
          <input class="ev-input" id="phone" name="phone" type="tel" inputmode="tel" required>
        </div>
        <div class="ev-field">
          <label class="ev-label" for="email">Courriel</label>
          <input class="ev-input" id="email" name="email" type="email">
        </div>
        <input type="hidden" id="city" name="city">
        <input type="hidden" id="notes" name="notes">
        <input type="hidden" id="consent" checked>

        <button class="ev-btn ev-btn-primary ev-btn-lg ev-btn-block" type="submit">Participer</button>
      </form>
    </div>

    <!-- THANK YOU -->
    <div id="thanks-view" class="hidden center" style="padding:80px 20px;">
      <h1 class="ev-h1">Merci.</h1>
      <p class="ev-lead mt-4" style="margin:0 auto;">Tirage à la fin du mois de mai — nous vous contactons si vous gagnez.</p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/event/icons.js"></script>
  <script src="/event/event.js"></script>
  <script>
    document.getElementById('header').innerHTML = MLP_EVENT.renderHeader({});
    document.getElementById('footer').innerHTML = MLP_EVENT.renderFooter();

    // Pre-fill segment from query string OR from saved diagnostic answer
    const urlSeg = new URLSearchParams(location.search).get('seg');
    if (urlSeg && MLP_EVENT.SEGMENTS[urlSeg]) MLP_EVENT.setSegment(urlSeg);
    let segment = MLP_EVENT.getSegment() || 'proprietaire';

    // Build segment picker
    const picker = document.getElementById('seg-picker');
    Object.entries(MLP_EVENT.SEGMENTS).forEach(([k, s]) => {
      const l = document.createElement('label');
      l.innerHTML = `
        <input type="radio" name="segment" value="${k}" ${k === segment ? 'checked' : ''}>
        <span class="pad">
          <span class="ic">${MLP_ICONS.svg(s.icon, { size: 22 })}</span>
          <span class="lbl">${s.label}</span>
        </span>`;
      l.querySelector('input').addEventListener('change', (e) => {
        segment = e.target.value;
        MLP_EVENT.setSegment(segment);
      });
      picker.appendChild(l);
    });

    document.getElementById('lead-form').addEventListener('submit', (e) => {
      e.preventDefault();
      MLP_EVENT.addLead({
        name:    document.getElementById('name').value,
        phone:   document.getElementById('phone').value,
        email:   document.getElementById('email').value,
        segment,
        consent: true,
        source:  'qr',
      });
      document.getElementById('form-view').classList.add('hidden');
      document.getElementById('thanks-view').classList.remove('hidden');
      MLP_EVENT.trackStep('lead-qr');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    MLP_EVENT.trackStep('event-form-view');
  </script>
</body>
</html>
