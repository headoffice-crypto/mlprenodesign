        fill="none" stroke="rgba(212,173,111,0.18)" stroke-width="1"/>

  <!-- Bold "M" monogram, geometric, optically centered -->
  <g fill="url(#ink)">
    <path d="M 14 50 L 14 14 L 22 14 L 32 36 L 42 14 L 50 14 L 50 50 L 43.5 50 L 43.5 26 L 35 44 L 29 44 L 20.5 26 L 20.5 50 Z"/>
