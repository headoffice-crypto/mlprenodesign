<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vitrine MLP — Diaporama</title>
  <link rel="stylesheet" href="/event/event.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #0b0f17; color: #fff; }
    body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* Two-column layout — content left, sidebar right.
       Nothing overlaps the photo: the chrome lives in its own column. */
    .frame {
      position: fixed; inset: 0;
      display: grid;
      grid-template-columns: 1fr 420px;
    }
    @media (max-width: 1100px) { .frame { grid-template-columns: 1fr 340px; } }
    @media (max-width: 800px)  { .frame { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

    /* Content area (left) — full-bleed photo or prize stage */
    .content {
      position: relative; overflow: hidden;
      background: #0b0f17;
    }
    .slide {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .slide.is-active { opacity: 1; }

    /* Photo — contain so the whole image is visible, no awkward crop */
    .slide.photo .img-wrap {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: #0b0f17;
    }
    .slide.photo img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .slide.is-active.photo img { animation: kenburns 9s ease-out forwards; }
    @keyframes kenburns {
      from { transform: scale(1.0); }
      to   { transform: scale(1.06); }
    }

    /* AVANT / APRÈS chip — scoped to the slide so it doesn't collide
       with the unrelated .tag on the brand mark */
    .slide .tag {
      position: absolute; top: 28px; left: 28px; z-index: 3;
      padding: 11px 22px; border-radius: 999px;
      background: rgba(0,0,0,.72); color: #fff;
      font-size: 13px; letter-spacing: .28em; text-transform: uppercase; font-weight: 700;
      backdrop-filter: blur(8px);
    }
    .slide .tag.after { background: var(--gold); color: #1a1208; }

    /* Prize stage — large icon + value + title, centered */
    .slide.prize .pz {
      position: absolute; inset: 0;
      display: grid; align-content: center; justify-items: center;
      gap: 28px; padding: 6vh 6vw; text-align: center;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(200,167,102,.10) 0%, transparent 70%),
        linear-gradient(180deg, #0b0f17 0%, #1a1208 100%);
    }
    .slide.prize .pz-eyebrow {
      color: var(--gold);
      font-size: 13px; letter-spacing: .3em; text-transform: uppercase; font-weight: 700;
    }
    .slide.prize .pz-badge {
      font-size: 12px; letter-spacing: .26em; text-transform: uppercase;
      color: rgba(255,255,255,.7);
      padding: 8px 18px; border: 1px solid rgba(200,167,102,.35); border-radius: 999px;
    }
    .slide.prize .pz-icon {
      width: clamp(120px, 13vw, 200px); height: clamp(120px, 13vw, 200px);
      border-radius: 36px;
      background: linear-gradient(135deg, var(--gold), var(--terra));
      display: grid; place-items: center; color: #1a1208;
      box-shadow: 0 40px 100px -20px rgba(200,167,102,.45);
    }
    .slide.prize .pz-icon .icon { width: 56%; height: 56%; }
    .slide.prize .pz-title {
      font-family: var(--serif); font-weight: 600;
      font-size: clamp(2rem, 3.8vw, 3.6rem); line-height: 1.06; margin: 0;
      max-width: 22ch; color: #fff;
    }
    .slide.prize .pz-value {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(3rem, 6.5vw, 5.6rem); line-height: 1;
      color: var(--gold);
    }
    .slide.is-active.prize .pz-eyebrow { animation: rise .55s ease-out .1s both; }
    .slide.is-active.prize .pz-badge   { animation: rise .55s ease-out .25s both; }
    .slide.is-active.prize .pz-icon    { animation: pop  .65s cubic-bezier(.4,1.6,.6,1) .35s both; }
    .slide.is-active.prize .pz-title   { animation: rise .55s ease-out .7s both; }
    .slide.is-active.prize .pz-value   { animation: rise .55s ease-out 1.0s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pop  { 0% { opacity: 0; transform: scale(.7); } 100% { opacity: 1; transform: scale(1); } }

    /* SIDEBAR — brand on top, caption middle, QR bottom */
    .sidebar {
      background: linear-gradient(180deg, #1a1208 0%, #0b0f17 100%);
      border-left: 1px solid rgba(200,167,102,.18);
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 24px;
      padding: 28px 28px 32px;
    }
    .brand-mark { display: flex; align-items: center; gap: 12px; }
    .brand-mark .logo {
      width: 44px; height: 44px; border-radius: 11px;
      background: linear-gradient(135deg, var(--gold), var(--terra));
      display: grid; place-items: center;
      color: #1a1208; font-family: var(--serif); font-weight: 700; font-size: 22px;
    }
    .brand-mark .name { font-family: var(--serif); color: #fff; font-size: 18px; font-weight: 600; line-height: 1.1; }
    .brand-mark .tag  { color: rgba(255,255,255,.65); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; margin-top: 3px; }

    /* Caption block — updates with each slide */
    .caption {
      display: flex; flex-direction: column; gap: 10px;
      min-height: 0;
      align-self: start;
    }
    .caption .cap-eyebrow {
      color: var(--gold);
      font-size: 11px; letter-spacing: .3em; text-transform: uppercase; font-weight: 700;
    }
    .caption .cap-title {
      font-family: var(--serif); font-weight: 600;
      font-size: clamp(1.45rem, 1.9vw, 1.85rem);
      line-height: 1.12; margin: 0; color: #fff;
    }
    .caption .cap-sub {
      color: rgba(255,255,255,.72);
      font-size: 14px; line-height: 1.5; margin: 0;
    }
    .caption.is-out { opacity: 0; transform: translateY(8px); }
    .caption { transition: opacity .35s ease, transform .35s ease; }

    /* Stake panel */
    .stakes {
      padding: 18px 20px;
      border: 1px solid rgba(200,167,102,.3);
      border-radius: 14px;
      background: rgba(200,167,102,.06);
      display: grid; gap: 4px;
    }
    .stakes .s-l { font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
    .stakes .s-v { font-family: var(--serif); color: #fff; font-size: 30px; line-height: 1; }
    .stakes .s-w { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.55); margin-top: 4px; }

    /* QR card */
    .qr-card {
      background: #fff; color: #1a1208;
      border-radius: 18px; padding: 16px;
      display: grid; gap: 8px; justify-items: center; text-align: center;
      box-shadow: 0 24px 50px -18px rgba(0,0,0,.5);
    }
    .qr-card img { width: 100%; max-width: 260px; height: auto; aspect-ratio: 1/1; display: block; }
    .qr-card .qr-l { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--terra); font-weight: 700; margin-top: 2px; }
    .qr-card .qr-cta { font-family: var(--serif); color: #1a1208; font-size: 1.3rem; line-height: 1; }
    .qr-card .qr-url { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5b4a2b; }

    /* Tiny ping dot so the operator sees the loop is alive */
    .ping {
      position: fixed; bottom: 14px; left: 18px; z-index: 50;
      width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
      animation: ping 2.4s ease-out infinite;
      pointer-events: none;
    }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(200,167,102,.6); }
      80%  { box-shadow: 0 0 0 14px rgba(200,167,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(200,167,102,0); }
    }

    /* Fullscreen toggle — floats bottom-left, clickable for touch screens.
       Stays visible in windowed mode; fades out once fullscreen is engaged
       (autohide via :fullscreen) to keep the booth display perfectly clean. */
    .fs-btn {
      position: fixed; bottom: 18px; left: 38px; z-index: 60;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 20px;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(200,167,102,.4);
      color: var(--gold);
      border-radius: 999px;
      font: 600 13px/1 'Inter', system-ui, sans-serif;
      letter-spacing: .2em; text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: opacity .2s ease, background .2s ease, border-color .2s ease;
    }
    .fs-btn:hover { background: rgba(0,0,0,.9); border-color: var(--gold); }
    .fs-btn .ic   { width: 16px; height: 16px; }
    /* When the document is in fullscreen, hide the button so it doesn't
       clutter the booth display. Move the mouse to reveal it again. */
    :fullscreen .fs-btn { opacity: 0; }
    :fullscreen .fs-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="frame">
    <!-- LEFT: rotating content (photos + prizes) -->
    <main class="content" id="stage"></main>

    <!-- RIGHT: fixed sidebar -->
    <aside class="sidebar">
      <div class="brand-mark">
        <div class="logo">M</div>
        <div>
          <div class="name">MLP Reno &amp; Design</div>
          <div class="tag">Gestion · Accompagnement · Rénovation</div>
        </div>
      </div>

      <div class="caption" id="caption">
        <div class="cap-eyebrow" id="cap-eyebrow"></div>
        <h1 class="cap-title" id="cap-title"></h1>
        <p class="cap-sub" id="cap-sub"></p>
      </div>

      <div class="stakes">
        <div class="s-l">À gagner ce soir</div>
        <div class="s-v">14 000 $</div>
        <div class="s-w">Tirage à la fin du mois de mai</div>
      </div>

      <div class="qr-card">
        <img id="qr-img" alt="QR — participez au tirage">
        <div class="qr-l">Participez au tirage</div>
        <div class="qr-cta">Scannez ici</div>
        <div class="qr-url" id="qr-url"></div>
      </div>
    </aside>
  </div>

  <div class="ping" title="Vitrine en lecture"></div>

  <button class="fs-btn" id="fs-btn" type="button">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
    </svg>
    <span id="fs-label">Plein écran</span>
  </button>

  <script src="/event/icons.js"></script>
  <script src="/event/event.js"></script>
  <script>
    const ic = (n, s) => MLP_ICONS.svg(n, { size: s || 100 });

    const PRIZE_ICON = {
      'plan-optimisation':  'layers',
      'feasibility-coord':  'shieldCheck',
      'roi-evaluation':     'trendingUp',
      'kitchen-island':     'chefHat',
      'bath-shower':        'bath',
      'redesign':           'sparkle',
      'gift-1000':          'gift',
      'gift-2000':          'gift',
    };

    /* Project pairs / solos — only crisp, high-resolution photos.
       The low-quality Google Street View "before" frontage is dropped.   */
    const PROJECTS = [
      { kind: 'pair',
        eyebrow: 'Maison Thomas-Dubuc · Salon',
        title:   "Mêmes murs. Autre maison.",
        sub:     "Plancher d'ingénierie, mur d'accent, ouverture sur la cuisine.",
        before:  '/event-media/thomas-dubuc/before/Before-Living-room.jpeg',
        after:   '/event-media/thomas-dubuc/after/Living-room-1.jpeg' },

      { kind: 'pair',
        eyebrow: 'Salle de bain · Projet 1',
        title:   "D'un cube vieillot à un spa lumineux.",
        sub:     "Douche italienne. Vanité sur mesure. Luminosité travaillée.",
        before:  '/css/js/assets/images/portfolio/bathrooms/bathroom-1-before.jpg',
        after:   '/css/js/assets/images/portfolio/bathrooms/bathroom-1-after.jpg' },

      { kind: 'pair',
        eyebrow: 'Salle de bain · Projet 2',
        title:   "Spa à la maison.",
        sub:     "Bain autoportant, douche italienne en verre, plafond mouluré.",
        before:  '/css/js/assets/images/portfolio/bathrooms/bathroom-2-before.jpg',
        after:   '/css/js/assets/images/portfolio/bathrooms/bathroom-2-after.jpg' },

      { kind: 'pair',
        eyebrow: 'Salle de bain · Projet 4',
        title:   "Du fonctionnel à l'élégant.",
        sub:     "Carreaux grand format. Vanité flottante. Robinetterie noire.",
        before:  '/css/js/assets/images/portfolio/bathrooms/bathroom-4-before.jpg',
        after:   '/css/js/assets/images/portfolio/bathrooms/bathroom-4-after.jpg' },

      // Finished-only hero shots (high-quality, no before)
      { kind: 'solo',
        eyebrow: 'Maison Thomas-Dubuc · Façade',
        title:   "Façade entièrement repensée.",
        sub:     "Revêtement, escaliers, garde-corps — tout est neuf.",
        src:     '/event-media/thomas-dubuc/after/Frontage-1.jpeg' },

      { kind: 'solo',
        eyebrow: 'Maison Thomas-Dubuc · Cuisine',
        title:   "La cuisine, refaite à neuf.",
        sub:     "Îlot central. Quincaillerie noire. Plan de travail en quartz.",
        src:     '/event-media/thomas-dubuc/after/Kitchen-2.jpeg' },

      { kind: 'solo',
        eyebrow: 'Maison Thomas-Dubuc · Sous-sol locatif',
        title:   "Un sous-sol qui paie l'hypothèque.",
        sub:     "Conversion légale en unité locative — permis obtenu, finitions livrées.",
        src:     '/event-media/thomas-dubuc/after/Basement-Kitchen.jpeg' },

      { kind: 'solo',
        eyebrow: 'Maison Thomas-Dubuc · Cour arrière',
        title:   "L'extérieur, prolongement du salon.",
        sub:     "Aménagement complet — gazon, terrasse, intimité.",
        src:     '/event-media/thomas-dubuc/after/Backyard.jpeg' },
    ];

    /* Build the photo queue: pairs → 2 slides (avant 5 s, après 7 s).
       Solos → 1 slide (6.5 s).                                        */
    const PHOTOS = [];
    PROJECTS.forEach(p => {
      if (p.kind === 'pair') {
        PHOTOS.push({
          kind: 'photo',
          src:  p.before, tag: 'Avant', tagClass: '',
          eyebrow: p.eyebrow,
          title:   "Avant qu'on s'en occupe.",
          sub:     '',
          dur: 5000,
        });
        PHOTOS.push({
          kind: 'photo',
          src:  p.after, tag: 'Après', tagClass: 'after',
          eyebrow: p.eyebrow,
          title:   p.title,
          sub:     p.sub,
          dur: 7000,
        });
      } else {
        PHOTOS.push({
          kind: 'photo',
          src:  p.src, tag: '', tagClass: '',
          eyebrow: p.eyebrow,
          title:   p.title,
          sub:     p.sub,
          dur: 6500,
        });
      }
    });

    /* Build prize slides — one per cadeau */
    const PRIZE_ORDER = [
      'plan-optimisation','feasibility-coord','roi-evaluation',
      'kitchen-island','bath-shower','redesign','gift-1000','gift-2000',
    ];
    const PRIZES = PRIZE_ORDER.map(k => {
      const g  = MLP_EVENT.GIVEAWAYS[k]; if (!g) return null;
      const gr = MLP_EVENT.GROUPS[g.group] || {};
      return {
        kind: 'prize',
        prizeKey: k,
        eyebrow: gr.short + ' · Cadeau à gagner',
        title:   g.title,
        sub:     gr.audience + ' · Tirage à la fin du mois de mai.',
        value:   g.value,
        badge:   gr.audience,
        dur: 7000,
      };
    }).filter(Boolean);

    /* Interleave: every 2 project-slides, insert one prize. Wraps around. */
    const QUEUE = [];
    let p = 0;
    PHOTOS.forEach((ph, i) => {
      QUEUE.push(ph);
      if (i % 2 === 1) QUEUE.push(PRIZES[(p++) % PRIZES.length]);
    });
    // Top up with any remaining prizes so all 8 appear at least once
    while (p < PRIZES.length) QUEUE.push(PRIZES[p++]);

    const STAGE = document.getElementById('stage');

    function buildSlide(s) {
      const el = document.createElement('section');
      if (s.kind === 'photo') {
        el.className = 'slide photo';
        el.innerHTML = `
          <div class="img-wrap"><img src="${s.src}" alt="" loading="lazy"></div>
          ${s.tag ? `<div class="tag ${s.tagClass}">${s.tag}</div>` : ''}`;
      } else {
        el.className = 'slide prize';
        el.innerHTML = `
          <div class="pz">
            <div class="pz-eyebrow">Cadeau à gagner · Tirage fin mai</div>
            <div class="pz-badge">${s.badge}</div>
            <div class="pz-icon">${ic(PRIZE_ICON[s.prizeKey] || 'gift', 110)}</div>
            <div class="pz-title">${s.title}</div>
            <div class="pz-value">${s.value.toLocaleString('fr-CA')}&nbsp;$</div>
          </div>`;
      }
      return el;
    }

    QUEUE.forEach(s => STAGE.appendChild(buildSlide(s)));

    const slides = STAGE.querySelectorAll('.slide');
    const cap    = document.getElementById('caption');
    const capE   = document.getElementById('cap-eyebrow');
    const capT   = document.getElementById('cap-title');
    const capS   = document.getElementById('cap-sub');

    let cur = 0;
    let timer = null;

    function show(i) {
      slides[cur].classList.remove('is-active');
      cur = ((i % slides.length) + slides.length) % slides.length;
      slides[cur].classList.add('is-active');
      const s = QUEUE[cur];
      // Crossfade the caption
      cap.classList.add('is-out');
      setTimeout(() => {
        capE.textContent = s.eyebrow || '';
        capT.textContent = s.title || '';
        capS.textContent = s.sub || '';
        cap.classList.remove('is-out');
      }, 300);
      clearTimeout(timer);
      timer = setTimeout(() => show(cur + 1), s.dur);
    }
    show(0);

    // QR target
    const url = location.origin + '/event';
    document.getElementById('qr-url').textContent = url.replace(/^https?:\/\//, '');
    document.getElementById('qr-img').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=0&data=' + encodeURIComponent(url);

    // Fullscreen toggle (click or F key)
    const fsBtn   = document.getElementById('fs-btn');
    const fsLabel = document.getElementById('fs-label');
    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.();
    }
    fsBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => {
      fsLabel.textContent = document.fullscreenElement ? 'Quitter' : 'Plein écran';
    });

    // Operator shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
      if (e.key === 'Escape') document.exitFullscreen?.();
      if (e.key === 'ArrowRight') show(cur + 1);
      if (e.key === 'ArrowLeft')  show(cur - 1);
    });

    // If a photo fails to load, skip past it
    STAGE.querySelectorAll('img').forEach(img => {
      img.addEventListener('error', () => {
        const idx = Array.from(slides).findIndex(s => s.contains(img));
        if (idx === cur) show(cur + 1);
      });
    });
  </script>
</body>
</html>
