<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Devis — MLP Reno &amp; Design</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#c8a45a">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent:#c8a45a;
      --accent-dark:#a68a3e;
      --accent-soft:#fffaf0;
      --ink:#202124;
      --muted:#5f6368;
      --hint:#9aa0a6;
      --line:#e8eaed;
      --line-soft:#f1f3f4;
      --bg:#f5f6f8;
      --green:#1e8e3e;
      --radius:14px;
      --shadow:0 1px 3px rgba(0,0,0,0.06), 0 4px 24px rgba(0,0,0,0.04);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--ink);
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      line-height:1.5; font-size:14px;
    }
    a{color:inherit}
    .page{
      max-width:820px; margin:32px auto; background:#fff;
      border-radius:var(--radius); box-shadow:var(--shadow);
      padding:48px 56px; position:relative;
    }
    .toolbar{
      display:flex; justify-content:flex-end; gap:8px;
      max-width:820px; margin:16px auto 0; padding:0 16px;
    }
    .btn{
      appearance:none; border:1px solid var(--line); background:#fff;
      color:var(--ink); border-radius:10px; padding:10px 16px;
      font:600 13px 'Inter',sans-serif; cursor:pointer;
      display:inline-flex; align-items:center; gap:8px;
      transition:all .15s ease; text-decoration:none;
    }
    .btn:hover{ background:#fafafa; border-color:#dadce0 }
    .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent) }
    .btn.primary:hover{ background:var(--accent-dark); border-color:var(--accent-dark) }

    /* Brand header */
    .brand{
      display:flex; justify-content:space-between; align-items:flex-start;
      gap:24px; padding-bottom:24px; border-bottom:2px solid var(--accent);
      margin-bottom:32px;
    }
    .brand-name{ font-size:24px; font-weight:800; color:var(--accent); letter-spacing:-0.3px }
    .brand-tag{ font-size:12px; color:var(--muted); margin-top:2px }
    .brand-contact{ text-align:right; font-size:12px; color:var(--muted); line-height:1.7 }
    .brand-contact strong{ color:var(--ink); display:block; font-size:13px }

    /* Doc title */
    .doc-head{
      display:flex; justify-content:space-between; align-items:flex-start;
      gap:24px; margin-bottom:32px;
    }
    .doc-title{ font-size:28px; font-weight:800; color:var(--ink); letter-spacing:-0.5px; line-height:1.1 }
    .doc-num{ font-size:14px; color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums }
    .doc-meta{ text-align:right; font-size:12px; color:var(--muted) }
    .doc-meta .label{ font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--hint) }
    .doc-meta .value{ font-size:13px; color:var(--ink); margin-bottom:8px }

    /* Parties */
    .parties{
      display:grid; grid-template-columns:1fr 1fr; gap:20px;
      margin-bottom:36px;
    }
    .party h4{
      font-size:10px; text-transform:uppercase; letter-spacing:0.7px;
      color:var(--hint); margin:0 0 8px; font-weight:700;
    }
    .party .name{ font-size:15px; font-weight:700; color:var(--ink); margin-bottom:2px }
    .party div{ font-size:13px; color:var(--muted); line-height:1.6 }

    /* Hero total */
    .hero{
      background:linear-gradient(135deg,#fffaf0 0%,#f5edda 100%);
      border:1px solid #ecd9a9; border-radius:var(--radius);
      padding:28px 32px; margin-bottom:36px;
      display:flex; justify-content:space-between; align-items:center; gap:16px;
    }
    .hero-label{
      font-size:10px; text-transform:uppercase; letter-spacing:0.7px; font-weight:700;
      color:var(--accent-dark); margin-bottom:4px;
    }
    .hero-project{ font-size:18px; font-weight:700; color:var(--ink); margin-bottom:2px }
    .hero-duration{ font-size:13px; color:var(--muted) }
    .hero-amount{ font-size:36px; font-weight:800; color:var(--ink); letter-spacing:-0.8px; font-variant-numeric:tabular-nums; line-height:1 }

    /* Sections */
    .sec-h{
      font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.7px;
      color:var(--ink); margin:32px 0 12px; padding-bottom:8px;
      border-bottom:1px solid var(--line);
    }

    /* Scope block */
    .scope{ font-size:14px; color:var(--ink); line-height:1.7; }
    .scope h1, .scope h2, .scope h3, .scope h4 {
      color:var(--ink); margin:20px 0 8px; letter-spacing:-0.1px;
    }
    .scope h1 { font-size:16px; font-weight:800; color:var(--accent-dark); border-bottom:1px solid var(--line-soft); padding-bottom:4px; }
    .scope h2 { font-size:15px; font-weight:700; }
    .scope h3 { font-size:14px; font-weight:700; }
    .scope ul { margin:6px 0 10px; padding-left:22px; }
    .scope li { margin:2px 0; color:var(--muted); }
    .scope li strong { color:var(--ink); font-weight:600; }
    .scope p { margin:6px 0; color:var(--muted); }
    .scope p strong { color:var(--ink); font-weight:600; }
    .scope em { color:var(--muted); font-style:italic; font-size:13px; display:block; margin:4px 0; }

    /* Price breakdown */
    .totals{
      background:#fafbfc; border:1px solid var(--line); border-radius:var(--radius);
      padding:18px 22px; margin-top:16px;
    }
    .tot-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:14px }
    .tot-row .lbl{ color:var(--muted) }
    .tot-row .val{ font-variant-numeric:tabular-nums; color:var(--ink) }
    .tot-row.grand{
      border-top:2px solid var(--accent); margin-top:8px; padding-top:12px;
      font-size:17px; font-weight:800;
    }
    .tot-row.grand .lbl{ color:var(--ink) }
    .tot-row.grand .val{ color:var(--accent-dark) }

    /* Payment schedule — simple list, no table */
    .schedule-list{
      background:var(--accent-soft); border:1px solid #ecd9a9; border-left:4px solid var(--accent);
      border-radius:10px; padding:18px 22px; margin-top:12px;
    }
    .schedule-item{
      display:flex; justify-content:space-between; align-items:baseline; gap:12px;
      padding:10px 0; border-bottom:1px dashed rgba(200,164,90,0.35);
      font-size:14px;
    }
    .schedule-item:last-child{ border-bottom:none }
    .schedule-label{
      color:var(--ink); font-weight:600;
    }
    .schedule-pct{
      color:var(--accent-dark); font-weight:700; font-size:12px;
      margin-left:6px; font-variant-numeric:tabular-nums;
    }
    .schedule-amount{
      color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }
    .schedule-tax{
      display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:2px;
    }

    /* Payment methods + notes blocks */
    .pay{
      background:#fafbfc; border-left:4px solid var(--accent);
      border-radius:10px; padding:14px 18px; font-size:13px;
      color:var(--ink); line-height:1.7; white-space:pre-line;
    }
    .notes{
      background:#fff8e1; border-left:4px solid #f0c36d;
      border-radius:10px; padding:14px 18px; font-size:12px;
      color:#5f4d1a; line-height:1.7; white-space:pre-line;
    }

    /* Footer */
    .foot{
      margin-top:44px; padding-top:20px; border-top:1px solid var(--line);
      text-align:center; font-size:11px; color:var(--hint); line-height:1.7;
    }

    /* States */
    .state{
      max-width:540px; margin:80px auto; background:#fff; border-radius:var(--radius);
      box-shadow:var(--shadow); padding:48px 32px; text-align:center;
    }
    .state .icon{
      width:48px; height:48px; border-radius:50%; background:#fef7e0;
      color:var(--accent); display:flex; align-items:center; justify-content:center;
      margin:0 auto 14px; font-size:24px; font-weight:800;
    }
    .state.error .icon{ background:#fce8e6; color:#d93025 }
    .state h2{ font-size:18px; margin:0 0 6px }
    .state p{ font-size:13px; color:var(--muted); margin:0 }
    .spinner{ display:inline-block; width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite }
    @keyframes spin{ to{ transform:rotate(360deg) } }

    /* Mobile */
    @media (max-width:640px){
      .page{ margin:0; padding:24px 20px; border-radius:0; box-shadow:none; min-height:100vh }
      .brand{ flex-direction:column; gap:10px }
      .brand-contact{ text-align:left }
      .doc-head{ flex-direction:column; gap:6px }
      .doc-meta{ text-align:left }
      .doc-title{ font-size:22px }
      .parties{ grid-template-columns:1fr; gap:16px }
      .hero{ flex-direction:column; align-items:flex-start; padding:20px }
      .hero-amount{ font-size:30px }
      .toolbar{ margin:8px auto; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); justify-content:space-between }
    }

    /* Print */
    @media print{
      body{ background:#fff }
      .toolbar{ display:none }
      .page{ box-shadow:none; margin:0; padding:32px 24px; max-width:none; border-radius:0 }
      @page{ size:letter; margin:14mm }
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button class="btn primary" onclick="window.print()" aria-label="Télécharger en PDF">
    <span aria-hidden="true">⬇</span>
    <span id="btn-print-label">Télécharger PDF</span>
  </button>
</div>

<div id="root">
  <div class="state">
    <div class="spinner" aria-label="Loading"></div>
    <p style="margin-top:14px;">Chargement…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config-public.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async function () {
  const root = document.getElementById('root');
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (!token) return showError('Lien invalide.');

  try {
    const { data: q, error } = await sb.from('quotes').select('*').eq('share_token', token).maybeSingle();
    if (error) throw error;
    if (!q) return showError('Devis introuvable.');
    render(q);
  } catch (err) {
    console.error(err);
    showError('Erreur de chargement.', err.message);
  }
})();

function render(q) {
  const fr = q.language !== 'en';
  document.documentElement.lang = fr ? 'fr' : 'en';
  document.title = (fr ? 'Devis' : 'Quote') + ' ' + q.quote_number + ' — MLP Reno & Design';
  document.getElementById('btn-print-label').textContent = fr ? 'Télécharger PDF' : 'Download PDF';

  const T = fr ? L_FR : L_EN;
  const options = Array.isArray(q.options) ? q.options : [];
  const opt = options.find(o => o.key === q.accepted_option_key) || options[0];
  if (!opt) return showError('Aucune option de prix.');

  const apply = opt.apply_taxes !== false;
  const quoteDate = q.quote_date || (q.created_at ? q.created_at.slice(0, 10) : '');
  const duration = opt.duration_weeks || q.duration_weeks;

  const html = `
  <div class="page">
    <div class="brand">
      <div>
        <div class="brand-name">MLP Reno &amp; Design</div>
        <div class="brand-tag">${T.brandTag}</div>
      </div>
      <div class="brand-contact">
        <strong>${T.rbq}: 5847-0378-01</strong>
        (450) 500-8936<br>
        headoffice@mlpexperience.com
      </div>
    </div>

    <div class="doc-head">
      <div>
        <div class="doc-title">${T.docTitle}</div>
        <div class="doc-num">${escHtml(q.quote_number)}</div>
      </div>
      <div class="doc-meta">
        <div class="label">${T.date}</div>
        <div class="value">${formatDate(quoteDate, fr)}</div>
        ${duration ? `<div class="label">${T.duration}</div><div class="value">${escHtml(String(duration))} ${fr ? 'semaines' : 'weeks'}</div>` : ''}
      </div>
    </div>

    <div class="parties">
      <div class="party">
        <h4>${T.billedTo}</h4>
        <div class="name">${escHtml(q.client_name || '')}</div>
        ${q.client_address ? `<div>${escHtml(q.client_address)}</div>` : ''}
        ${q.client_email ? `<div>${escHtml(q.client_email)}</div>` : ''}
        ${q.client_phone ? `<div>${escHtml(q.client_phone)}</div>` : ''}
      </div>
      <div class="party">
        <h4>${T.project}</h4>
        <div class="name">${escHtml(q.project_title || '—')}</div>
      </div>
    </div>

    <div class="hero">
      <div>
        <div class="hero-label">${T.projectPrice}</div>
        <div class="hero-project">${escHtml(opt.title || q.project_title || '')}</div>
        ${duration ? `<div class="hero-duration">${T.durationLabel} : ${escHtml(String(duration))} ${fr ? 'semaines' : 'weeks'}</div>` : ''}
      </div>
      <div style="text-align:right;">
        <div class="hero-amount">$${money(opt.total)}</div>
        <div style="font-size:11px;color:#a68a3e;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-top:6px;">${apply ? T.taxesIncl : T.taxesExcl}</div>
      </div>
    </div>

    ${opt.scope_summary ? `
      <h3 class="sec-h">${T.scope}</h3>
      <div class="scope">${renderMarkdown(opt.scope_summary)}</div>
    ` : ''}

    <h3 class="sec-h">${T.priceBreakdown}</h3>
    <div class="totals">
      <div class="tot-row"><span class="lbl">${T.subtotal}</span><span class="val">$${money(opt.subtotal)}</span></div>
      ${apply ? `
        <div class="tot-row"><span class="lbl">TPS (5%)</span><span class="val">$${money(opt.gst)}</span></div>
        <div class="tot-row"><span class="lbl">TVQ (9.975%)</span><span class="val">$${money(opt.qst)}</span></div>
      ` : ''}
      <div class="tot-row grand"><span class="lbl">${apply ? T.totalIncl : T.totalExcl}</span><span class="val">$${money(opt.total)}</span></div>
    </div>

    <h3 class="sec-h">${T.paymentSchedule}</h3>
    <div class="schedule-list">${renderScheduleList(q, opt, fr)}</div>

    ${q.payment_methods ? `
      <h3 class="sec-h">${T.paymentMethods}</h3>
      <div class="pay">${escHtml(q.payment_methods)}</div>
    ` : ''}

    ${q.notes ? `
      <h3 class="sec-h">${T.notes}</h3>
      <div class="notes">${escHtml(q.notes)}</div>
    ` : ''}

    <div class="foot">
      MLP Reno &amp; Design — ${T.rbq} 5847-0378-01 — (450) 500-8936 — headoffice@mlpexperience.com
    </div>
  </div>`;

  document.getElementById('root').innerHTML = html;
}

function renderScheduleList(q, opt, fr) {
  const DEFAULTS = {
    A: [
      { label_fr: 'Dépôt',           label_en: 'Deposit',         pct: 10 },
      { label_fr: 'Avant début',     label_en: 'Before start',    pct: 40 },
      { label_fr: 'Mi-parcours',     label_en: 'Mid-project',     pct: 40 },
      { label_fr: 'Fin des travaux', label_en: 'Upon completion', pct: 10 }
    ],
    B: [
      { label_fr: 'Dépôt',           label_en: 'Deposit',         pct: 20 },
      { label_fr: 'Avant début',     label_en: 'Before start',    pct: 30 },
      { label_fr: 'Mi-parcours',     label_en: 'Mid-project',     pct: 40 },
      { label_fr: 'Fin des travaux', label_en: 'Upon completion', pct: 10 }
    ],
    C: [
      { label_fr: 'Dépôt',           label_en: 'Deposit',         pct: 20 },
      { label_fr: 'Avant début',     label_en: 'Before start',    pct: 40 },
      { label_fr: 'Mi-parcours',     label_en: 'Mid-project',     pct: 30 },
      { label_fr: 'Fin des travaux', label_en: 'Upon completion', pct: 10 }
    ]
  };
  const embedded = q.ai_conversation && q.ai_conversation.payment_schedule;
  const rows = (embedded && Array.isArray(embedded.rows) && embedded.rows.length)
    ? embedded.rows.map(r => ({ label_fr: r.label_fr || '', label_en: r.label_en || '', pct: Number(r.pct) || 0 })).filter(r => r.pct > 0)
    : (DEFAULTS[q.payment_option || 'A'] || DEFAULTS.A);

  const base = Number(opt.subtotal || 0);
  const apply = opt.apply_taxes !== false;

  return rows.map(r => {
    const label = fr ? r.label_fr : r.label_en;
    const pre = Math.round(base * r.pct) / 100;
    const gst = apply ? Math.round(pre * 0.05 * 100) / 100 : 0;
    const qst = apply ? Math.round(pre * 0.09975 * 100) / 100 : 0;
    const tot = Math.round((pre + gst + qst) * 100) / 100;
    const taxLine = apply
      ? `${fr ? 'Sous-total' : 'Subtotal'} $${money(pre)} + TPS $${money(gst)} + TVQ $${money(qst)}`
      : `${fr ? 'Sous-total' : 'Subtotal'} $${money(pre)}`;
    return `
      <div class="schedule-item">
        <div>
          <span class="schedule-label">${escHtml(label)}</span>
          <span class="schedule-pct">${r.pct}%</span>
          <span class="schedule-tax">${taxLine}</span>
        </div>
        <div class="schedule-amount">$${money(tot)}</div>
      </div>`;
  }).join('');
}

/* Minimal markdown → HTML (#/##/### headings, - lists, **bold**, *italic*). */
function renderMarkdown(text) {
  if (!text) return '';
  const inline = (s) => s
    .replace(/\*\*([^\n*]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^\n*]+?)\*(?!\*)/g, '$1<em>$2</em>');
  const escaped = escHtml(text);
  const lines = escaped.split('\n');
  let out = '';
  let inList = false;
  const closeList = () => { if (inList) { out += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { closeList(); out += ''; continue; }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.+)$/))) {
      closeList();
      const lvl = m[1].length;
      out += `<h${lvl}>${inline(m[2])}</h${lvl}>`;
      continue;
    }
    if ((m = line.match(/^\s*[-*]\s+(.+)$/))) {
      if (!inList) { out += '<ul>'; inList = true; }
      out += `<li>${inline(m[1])}</li>`;
      continue;
    }
    closeList();
    out += `<p>${inline(line)}</p>`;
  }
  closeList();
  return out;
}

function showError(msg, detail) {
  document.getElementById('root').innerHTML = `
    <div class="state error">
      <div class="icon">!</div>
      <h2>${escHtml(msg)}</h2>
      ${detail ? `<p>${escHtml(detail)}</p>` : ''}
    </div>`;
}

const L_FR = {
  brandTag: 'Construction & Rénovation',
  rbq: 'RBQ',
  docTitle: 'Devis',
  date: 'Date du devis',
  duration: 'Durée estimée',
  billedTo: 'Cliente',
  project: 'Projet',
  projectPrice: 'Prix du projet',
  durationLabel: 'Durée estimée',
  taxesIncl: 'Taxes incluses',
  taxesExcl: 'Avant taxes',
  scope: 'Portée des travaux',
  priceBreakdown: 'Détail du prix',
  subtotal: 'Sous-total',
  totalIncl: 'Total avec taxes',
  totalExcl: 'Total avant taxes',
  paymentSchedule: 'Échéancier des paiements',
  paymentMethods: 'Modes de paiement',
  notes: 'Notes importantes'
};
const L_EN = {
  brandTag: 'Construction & Renovation',
  rbq: 'RBQ Licence',
  docTitle: 'Quote',
  date: 'Quote date',
  duration: 'Estimated duration',
  billedTo: 'Client',
  project: 'Project',
  projectPrice: 'Project price',
  durationLabel: 'Estimated duration',
  taxesIncl: 'Taxes included',
  taxesExcl: 'Before taxes',
  scope: 'Scope of work',
  priceBreakdown: 'Price breakdown',
  subtotal: 'Subtotal',
  totalIncl: 'Total with taxes',
  totalExcl: 'Total before taxes',
  paymentSchedule: 'Payment schedule',
  paymentMethods: 'Payment methods',
  notes: 'Important notes'
};

function escHtml(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(n) { return Number(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function formatDate(s, fr) {
  if (!s) return '';
  const d = new Date(s.length === 10 ? s + 'T00:00:00' : s);
  if (isNaN(d)) return s;
  if (fr) {
    const m = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
  }
  return d.toLocaleDateString('en-CA', { year:'numeric', month:'long', day:'numeric' });
}
</script>
</body>
