<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Projet — MLP Reno & Design</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#c8a45a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MLP Tools">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="css/tools.css?v=27">
  <style>
    .project-head {
      background: var(--surface);
      border: 1px solid var(--outline-light);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .project-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
    .project-sub { font-size: 13px; color: var(--text-secondary); }
    .pj-status-select {
      font-size: 12px; font-weight: 600;
      padding: 6px 10px; border-radius: 16px;
      border: 1.5px solid var(--outline);
      background: var(--white);
      cursor: pointer;
      margin-top: 10px;
    }

    .invoice-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; gap: 12px;
      border-bottom: 1px solid var(--outline-light);
    }
    .invoice-row:last-child { border-bottom: none; }
    .invoice-main { flex: 1; min-width: 0; }
    .invoice-title { font-weight: 600; font-size: 14px; color: var(--text-primary); margin-bottom: 2px; }
    .invoice-sub { font-size: 12px; color: var(--text-secondary); }
    .invoice-amount { font-size: 15px; font-weight: 700; color: var(--accent-dark); white-space: nowrap; }
    .invoice-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .inv-status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .inv-status-pending { background: var(--surface-dim); color: var(--text-secondary); }
    .inv-status-sent    { background: var(--blue-light);  color: var(--blue); }
    .inv-status-paid    { background: var(--green-light); color: var(--green); }
    .inv-status-overdue { background: var(--red-light);   color: var(--red); }

    .action-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--outline-light);
    }
    .action-item:last-child { border-bottom: none; }
    .action-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
    .action-item input[type="text"] {
      flex: 1; background: none; border: none;
      font-size: 14px; color: var(--text-primary); font-family: inherit;
      padding: 4px;
    }
    .action-item input[type="text"]:focus { outline: none; background: var(--surface-dim); border-radius: 4px; }
    .action-item.done input[type="text"] { text-decoration: line-through; color: var(--text-hint); }
    .action-remove { background: none; border: none; color: var(--text-hint); cursor: pointer; padding: 4px; border-radius: 4px; }
    .action-remove:hover { background: var(--red-light); color: var(--red); }

    /* Photos */
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .photo-card {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface-dim);
      cursor: pointer;
    }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-card .cap {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: #fff; font-size: 11px; padding: 20px 8px 6px;
    }
    .photo-card .rm {
      position: absolute; top: 6px; right: 6px;
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s;
    }
    .photo-card:hover .rm { opacity: 1; }
    .photo-category-tabs {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .photo-cat {
      padding: 8px 14px; font-size: 13px; font-weight: 600;
      background: var(--white); border: 1.5px solid var(--outline);
      border-radius: 16px; cursor: pointer; color: var(--text-secondary);
      transition: var(--transition);
    }
    .photo-cat.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .photo-upload-area {
      border: 2px dashed var(--outline);
      border-radius: var(--radius-xs);
      padding: 20px;
      text-align: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 12px;
    }
    .photo-upload-area:hover { border-color: var(--accent); background: var(--accent-light); }

    .section-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 10px; }

    /* Invoice adjuster modal */
    .adj-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .adj-modal {
      background: #fff; border-radius: var(--radius);
      max-width: 460px; width: 100%;
      padding: 22px 22px 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.24);
    }
    .adj-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.2px; }
    .adj-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
    .adj-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .adj-field label { display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .adj-field input {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--outline);
      border-radius: 8px; font-size: 15px; font-weight: 600; font-family: inherit;
    }
    .adj-field input:focus { outline: none; border-color: var(--accent); }
    .adj-preview {
      background: var(--surface-dim); border-radius: 8px;
      padding: 12px 14px; margin: 14px 0 16px;
      font-size: 13px; line-height: 1.7;
    }
    .adj-preview .r { display: flex; justify-content: space-between; }
    .adj-preview strong { color: var(--text-primary); }
    .adj-warn {
      font-size: 12px; color: var(--text-secondary);
      background: #fef7e0; border-left: 3px solid var(--accent);
      padding: 8px 12px; border-radius: 6px; margin-bottom: 14px;
    }
    .adj-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .adj-actions .btn { flex: 0 1 auto; }
    @media (max-width: 520px) {
      .adj-row { grid-template-columns: 1fr; }
      .adj-actions .btn { flex: 1 1 100%; }
    }

    /* Payment ledger */
    .section-title-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin: 20px 0 10px;
    }
    .section-title-row .section-title { margin: 0; }
    .payment-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; gap: 12px;
      border-bottom: 1px solid var(--outline-light);
    }
    .payment-row:last-child { border-bottom: none; }
    .payment-main { flex: 1; min-width: 0; }
    .payment-title { font-weight: 600; font-size: 14px; color: var(--text-primary); }
    .payment-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .payment-amount { font-size: 15px; font-weight: 700; color: var(--green); white-space: nowrap; }
    .payment-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .empty-ledger {
      padding: 20px 16px; text-align: center;
      font-size: 13px; color: var(--text-hint);
    }

    /* Payment modal (reuses .adj-backdrop) */
    .pay-field { margin-bottom: 12px; }
    .pay-field label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .pay-field input, .pay-field select, .pay-field textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--outline);
      border-radius: 8px; font-size: 14px; font-family: inherit;
      background: #fff; color: var(--text-primary);
    }
    .pay-field input:focus, .pay-field select:focus, .pay-field textarea:focus {
      outline: none; border-color: var(--accent);
    }
    .pay-field textarea { resize: vertical; min-height: 60px; }
    .pay-field .hint { font-size: 11px; color: var(--text-hint); margin-top: 4px; }
    .pay-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .pay-two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <a href="customers.html" class="header-link" style="color:inherit;"><span class="material-icons-round">arrow_back</span></a>
    <div class="header-logo">M</div>
    <h1>MLP Reno &amp; Design</h1>
  </div>
</div>

<div class="main">
  <div id="root">
    <div style="text-align:center;padding:40px;color:var(--text-secondary);">
      <div class="spinner-ring" style="width:28px;height:28px;border-width:3px;margin-bottom:12px;"></div>
      <div>Chargement du projet…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
let project = null;
let quote = null;
let invoices = [];
let payments = [];
let photos = [];
let activePhotoCat = 'before';

(async function() {
  const root = document.getElementById('root');
  const params = new URLSearchParams(location.search);
  const quoteId = params.get('quote_id');
  const projectId = params.get('id');

  try {
    if (projectId) {
      project = await getProject(projectId);
      if (!project) throw new Error('Projet introuvable');
      quote = await sb.from('quotes').select('*').eq('id', project.quote_id).maybeSingle().then(r => r.data);
    } else if (quoteId) {
      quote = await sb.from('quotes').select('*').eq('id', quoteId).maybeSingle().then(r => r.data);
      if (!quote) throw new Error('Soumission introuvable');
      project = await getProjectByQuoteId(quoteId);
      // Auto-create project if none exists (e.g. trigger hasn't fired for a manual signed quote)
      if (!project) {
        const { data, error } = await sb.from('projects').insert({ quote_id: quote.id, customer_id: quote.customer_id }).select('*').single();
        if (error) throw error;
        project = data;
      }
    } else {
      throw new Error('quote_id ou id requis');
    }

    // Load invoices (auto-generate if none) + payments + photos
    invoices = await getOrGenerateInvoicesForProject(project, quote);
    payments = await listProjectPayments(project.id);
    photos = await listProjectPhotos(project.id);

    // Migrate old {text, done} action items to new {id, text, pct} format
    // AND auto-populate from accepted option line items if empty
    project = await ensureActionItems(project, quote);

    render();
  } catch (err) {
    console.error(err);
    root.innerHTML = `<div class="card" style="color:var(--red);">Erreur: ${err.message}</div>`;
  }
})();

async function ensureActionItems(proj, q) {
  let items = Array.isArray(proj.action_items) ? proj.action_items : [];
  let changed = false;

  // Migrate legacy shape: {text, done} -> {id, text, pct}
  items = items.map((it, idx) => {
    if ('pct' in it) return it;
    changed = true;
    return {
      id: it.id || ('mig-' + idx),
      text: it.text || '',
      pct: it.done ? 100 : 0,
      updated_at: it.done_at || new Date().toISOString()
    };
  });

  // If still empty and the quote has an accepted option with line items, generate from those
  if (items.length === 0) {
    const opts = Array.isArray(q.options) ? q.options : [];
    const accepted = opts.find(o => o.key === q.accepted_option_key) || opts[0];
    if (accepted && Array.isArray(accepted.line_items) && accepted.line_items.length) {
      items = accepted.line_items.map((li, idx) => ({
        id: 'gen-' + idx,
        text: li.description || '',
        pct: 0,
        updated_at: new Date().toISOString()
      }));
      changed = true;
    }
  }

  if (changed) {
    const updated = await updateProject(proj.id, { action_items: items });
    return updated;
  }
  return proj;
}

function computeOverallProgress() {
  const items = project.action_items || [];
  if (!items.length) return 0;
  const sum = items.reduce((s, it) => s + (Number(it.pct) || 0), 0);
  return Math.round(sum / items.length);
}

function render() {
  const root = document.getElementById('root');
  const opts = quote.options || [];
  const accepted = opts.find(o => o.key === quote.accepted_option_key) || opts[0];
  const totalSigned = accepted ? accepted.total : 0;
  // Balance is driven by the payments ledger, not by invoice.status.
  const totalPaid = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const totalOutstanding = Math.max(0, totalSigned - totalPaid);
  const overallPct = computeOverallProgress();

  let h = '';

  // HEAD
  h += `<div class="project-head">
    <div class="project-title">${esc(quote.project_title || quote.quote_number)}</div>
    <div class="project-sub">
      Client : <a href="customer.html?id=${encodeURIComponent(quote.customer_id)}" style="color:var(--accent-dark);">${esc(quote.client_name || '—')}</a>
      · ${esc(quote.client_address || '')}
    </div>
    <div class="customer-stats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;">
      <div class="stat-card" style="background:var(--surface-dim);border-radius:8px;padding:12px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:var(--accent-dark);">$${money(totalSigned)}</div>
        <div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Valeur du projet</div>
      </div>
      <div class="stat-card" style="background:var(--green-light);border-radius:8px;padding:12px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:var(--green);">$${money(totalPaid)}</div>
        <div style="font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Encaissé</div>
      </div>
      <div class="stat-card" style="background:${totalOutstanding > 0 ? 'var(--orange-light)' : 'var(--surface-dim)'};border-radius:8px;padding:12px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:${totalOutstanding > 0 ? 'var(--orange)' : 'var(--text-secondary)'};">$${money(totalOutstanding)}</div>
        <div style="font-size:11px;color:${totalOutstanding > 0 ? 'var(--orange)' : 'var(--text-secondary)'};text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">À recevoir</div>
      </div>
    </div>
    <select class="pj-status-select" id="project-status">
      ${['planning','active','on_hold','completed','cancelled'].map(s =>
        `<option value="${s}" ${project.status === s ? 'selected' : ''}>${statusFr(s)}</option>`
      ).join('')}
    </select>
  </div>`;

  // OVERALL PROGRESS
  h += `<div class="overall-progress-card">
    <div class="overall-progress-head">
      <div class="overall-progress-label">Avancement global</div>
      <div class="overall-progress-pct">${overallPct}%</div>
    </div>
    <div class="overall-progress-bar"><div class="overall-progress-bar-fill ${overallPct === 100 ? 'done' : ''}" style="width:${overallPct}%;"></div></div>
    <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:12px;" onclick="sendProgressUpdate('email', this)">
      <span class="material-icons-round">send</span>
      <span>Envoyer une mise à jour au client</span>
    </button>
  </div>`;

  // INVOICES
  h += `<div class="section-title-row">
    <div class="section-title">Facturation</div>
    <button class="btn btn-primary btn-sm" style="padding:6px 12px;font-size:12px;" onclick="openPaymentModal()">
      <span class="material-icons-round" style="font-size:14px">payments</span>
      Enregistrer un paiement
    </button>
  </div>`;
  h += '<div class="card-flat">';
  invoices.forEach(inv => h += invoiceRow(inv));
  h += '</div>';

  // PAYMENTS RECEIVED
  h += '<div class="section-title">Paiements reçus</div>';
  h += '<div class="card-flat">';
  if (payments.length === 0) {
    h += '<div class="empty-ledger">Aucun paiement enregistré pour ce projet.</div>';
  } else {
    payments.forEach(p => h += paymentRow(p));
  }
  h += '</div>';

  // ACTION ITEMS
  h += '<div class="section-title">Avancement par tâche</div>';
  h += '<div class="card-flat" id="action-items-box">';
  (project.action_items || []).forEach((item, idx) => h += actionItemRow(item, idx));
  h += '</div>';
  h += '<button class="btn-add" onclick="addActionItem()">+ Ajouter une tâche</button>';

  // PHOTOS
  h += '<div class="section-title">Photos</div>';
  h += `<div class="card">
    <div class="photo-category-tabs">
      <button class="photo-cat ${activePhotoCat === 'before' ? 'active' : ''}" onclick="setPhotoCat('before')">Avant</button>
      <button class="photo-cat ${activePhotoCat === 'during' ? 'active' : ''}" onclick="setPhotoCat('during')">Pendant</button>
      <button class="photo-cat ${activePhotoCat === 'after' ? 'active' : ''}" onclick="setPhotoCat('after')">Après</button>
    </div>
    <label class="photo-upload-area" for="photo-upload">
      <span class="material-icons-round" style="font-size:32px;color:var(--accent);">add_a_photo</span>
      <div style="font-weight:600;margin-top:6px;">Téléverser une photo ${activePhotoCat === 'before' ? 'avant' : activePhotoCat === 'after' ? 'après' : 'pendant'} les travaux</div>
      <div style="font-size:12px;">Cliquez ou faites glisser une image (JPEG/PNG, max 10 Mo)</div>
    </label>
    <input type="file" id="photo-upload" accept="image/*" style="display:none;">
    <div class="photo-grid" id="photo-grid">${renderPhotos()}</div>
  </div>`;

  // PROJECT NOTES
  h += '<div class="section-title">Notes du projet</div>';
  h += `<div class="card"><textarea class="form-textarea" id="project-notes" rows="5" placeholder="Notes internes sur l'avancement, les imprévus, etc.">${esc(project.notes || '')}</textarea></div>`;

  // QUOTE LINK
  h += `<div class="section-title">Soumission liée</div>
    <a href="sign.html?token=${encodeURIComponent(quote.share_token || '')}" target="_blank" class="card" style="display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit;">
      <div>
        <div style="font-weight:600;">${esc(quote.quote_number)}</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">Voir la soumission signée</div>
      </div>
      <span class="material-icons-round" style="color:var(--accent-dark);">open_in_new</span>
    </a>`;

  root.innerHTML = h;
  wireUp();
}

function invoiceRow(inv) {
  const due = inv.due_date ? new Date(inv.due_date).toLocaleDateString('fr-CA') : '';
  return `<div class="invoice-row">
    <div class="invoice-main">
      <div class="invoice-title">${esc(inv.label)} <span style="color:var(--text-hint);font-weight:400;">· ${inv.pct_of_total}%</span></div>
      <div class="invoice-sub">${esc(inv.invoice_number)}${inv.paid_at ? ' · Payée ' + new Date(inv.paid_at).toLocaleDateString('fr-CA') : ''}${inv.sent_at && !inv.paid_at ? ' · Envoyée ' + new Date(inv.sent_at).toLocaleDateString('fr-CA') : ''}</div>
      <div class="invoice-actions">
        <button class="btn btn-secondary btn-sm" style="padding:6px 10px;font-size:12px;" onclick="previewInvoice('${esc(inv.share_token || '')}')" title="Aperçu côté client (nouvelle fenêtre)">
          <span class="material-icons-round" style="font-size:14px">visibility</span> Aperçu
        </button>
        <button class="btn btn-secondary btn-sm" style="padding:6px 10px;font-size:12px;" onclick="sendInvoice('${inv.id}', 'email', this)" title="${inv.status === 'paid' ? 'Envoyer le reçu par courriel' : 'Envoyer la facture par courriel'}">
          <span class="material-icons-round" style="font-size:14px">mail</span> ${inv.status === 'paid' ? 'Reçu courriel' : 'Courriel'}
        </button>
        <button class="btn btn-secondary btn-sm" style="padding:6px 10px;font-size:12px;" onclick="sendInvoice('${inv.id}', 'sms', this)" title="${inv.status === 'paid' ? 'Envoyer le reçu par SMS' : 'Envoyer la facture par SMS'}">
          <span class="material-icons-round" style="font-size:14px">sms</span> ${inv.status === 'paid' ? 'Reçu SMS' : 'SMS'}
        </button>
        ${inv.status !== 'paid' ? `
          <button class="btn btn-primary btn-sm" style="padding:6px 10px;font-size:12px;" onclick="openPaymentModal('${inv.id}')">
            <span class="material-icons-round" style="font-size:14px">check</span> Payée
          </button>
        ` : ''}
      </div>
    </div>
    <div style="text-align:right;">
      <div class="invoice-amount">$${money(inv.amount_total)}</div>
      <span class="inv-status-pill inv-status-${inv.status}">${invStatusFr(inv.status)}</span>
    </div>
  </div>`;
}

function actionItemRow(item, idx) {
  const pct = Number(item.pct) || 0;
  const done = pct === 100;
  return `<div class="action-item-pro" data-idx="${idx}">
    <div class="a-body">
      <input type="text" value="${esc(item.text || '')}" onchange="updateActionText(${idx}, this.value)" placeholder="Tâche">
      <div class="action-progress"><div class="action-progress-fill ${done ? 'done' : ''}" style="width:${pct}%;"></div></div>
    </div>
    <select class="action-pct-select ${done ? 'done' : ''}" onchange="updateActionPct(${idx}, this.value)">
      ${[0,10,25,50,75,90,100].map(v => `<option value="${v}" ${v === pct ? 'selected' : ''}>${v}%</option>`).join('')}
    </select>
    <button class="action-remove" onclick="removeAction(${idx})" title="Supprimer"><span class="material-icons-round" style="font-size:18px;">close</span></button>
  </div>`;
}

  let timer = null;
  notesEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try { project = await updateProject(project.id, { notes: notesEl.value }); showToast('Notes enregistrées'); }
      catch (err) { showToast('Erreur : ' + err.message); }
    }, 800);
  });

  const photoInput = document.getElementById('photo-upload');
  photoInput.addEventListener('change', async (e) => {

  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-ring"></span><span>Envoi…</span>';

      method: 'POST',

async function sendInvoice(invoiceId, channel, btn) {
  const inv = invoices.find(i => i.id === invoiceId);
  if (!inv) return;

  // Paid invoices go out as receipts unchanged — skip the adjuster.
  if (inv.status !== 'paid') {
    const adjust = await openInvoiceAdjuster(inv);
    if (adjust === null) return; // cancelled
    if (adjust.changed) {
      try {
        showToast('Ajustement du montant…');
        invoices = await adjustInvoice(inv.id, { pct: adjust.pct }, quote, invoices);
        render();
      } catch (err) {
        showToast('Erreur : ' + err.message);
        return;
      }
    }
  }

  const liveBtn = btn && btn.isConnected ? btn : document.querySelector(`[data-invoice-send-btn="${invoiceId}-${channel}"]`);
  const originalHtml = liveBtn ? liveBtn.innerHTML : '';
  if (liveBtn) {
    liveBtn.disabled = true;
    liveBtn.innerHTML = '<span class="spinner-ring" style="width:12px;height:12px;border-width:2px;"></span> …';
  }
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-quote', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ invoice_id: invoiceId, channel })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    // refresh invoices
    invoices = await sb.from('invoices').select('*').eq('project_id', project.id).order('sequence').then(r => r.data || []);
    render();
    showToast(channel === 'sms' ? `SMS envoyé à ${data.to}` : `Courriel envoyé à ${data.to}`);
  } catch (err) {
    showToast('Erreur : ' + err.message);
    if (liveBtn) { liveBtn.disabled = false; liveBtn.innerHTML = originalHtml; }
  }
}

// Modal that lets the contractor override this invoice's % (or pre-tax amount)
// before it goes out. Delta auto-shifts to the next unpaid installment.
// Resolves { changed:boolean, pct:number } on OK, or null on cancel.
function openInvoiceAdjuster(inv) {
  return new Promise((resolve) => {
    const opts = quote.options || [];
    const accepted = opts.find(o => o.key === quote.accepted_option_key) || opts[0];
    const base = Number(accepted?.subtotal || 0);
    const applyTaxes = accepted ? accepted.apply_taxes !== false : true;
    if (base <= 0) { showToast('Sous-total de la soumission introuvable'); resolve(null); return; }

    const contractTotal = invoices.reduce((s, i) => s + Number(i.amount_total || 0), 0);
    const paidToDate    = invoices.filter(i => i.status === 'paid').reduce((s, i) => s + Number(i.amount_total || 0), 0);
    const currentPct    = Number(inv.pct_of_total || 0);
    const nextInv       = invoices
      .filter(i => i.id !== inv.id && i.status !== 'paid' && i.status !== 'cancelled' && i.sequence > inv.sequence)
      .sort((a, b) => a.sequence - b.sequence)[0];

    const backdrop = document.createElement('div');
    backdrop.className = 'adj-backdrop';
    backdrop.innerHTML = `
      <div class="adj-modal" role="dialog" aria-modal="true">
        <div class="adj-title">Ajuster avant l'envoi</div>
        <div class="adj-sub">Versement « ${esc(inv.label || '')} » · ${esc(inv.invoice_number)}</div>

        <div class="adj-row">
          <div class="adj-field">
            <label>Pourcentage</label>
            <input type="number" id="adj-pct" step="0.01" min="0" max="100" value="${currentPct}">
          </div>
          <div class="adj-field">
            <label>Montant avant taxes ($)</label>
            <input type="number" id="adj-amt" step="0.01" min="0" value="${Number(inv.amount_before_tax || 0).toFixed(2)}">
          </div>
        </div>

        <div class="adj-preview" id="adj-preview"></div>

        ${nextInv
          ? `<div class="adj-warn">La différence sera automatiquement reportée sur le prochain versement : <strong>${esc(nextInv.label || '')}</strong>.</div>`
          : `<div class="adj-warn">Aucun versement suivant à ajuster — la différence ne sera pas redistribuée.</div>`}

        <div class="adj-actions">
          <button class="btn btn-secondary btn-sm" id="adj-cancel">Annuler</button>
          <button class="btn btn-secondary btn-sm" id="adj-skip">Envoyer sans modifier</button>
          <button class="btn btn-primary btn-sm" id="adj-ok">Enregistrer &amp; envoyer</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);

    const pctEl = backdrop.querySelector('#adj-pct');
    const amtEl = backdrop.querySelector('#adj-amt');
    const prev  = backdrop.querySelector('#adj-preview');

    const recompute = (pct) => {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));
      const preTax = Math.round(base * p) / 100;
      const gst = applyTaxes ? Math.round(preTax * 0.05 * 100) / 100 : 0;
      const qst = applyTaxes ? Math.round(preTax * 0.09975 * 100) / 100 : 0;
      const total = Math.round((preTax + gst + qst) * 100) / 100;
      const newContract = contractTotal - Number(inv.amount_total || 0) + total;
      const newBalance = Math.max(0, newContract - paidToDate - (inv.status === 'paid' ? 0 : total));
      prev.innerHTML = `
        <div class="r"><span>Sous-total</span><strong>$${money(preTax)}</strong></div>
        ${applyTaxes ? `<div class="r"><span>TPS 5%</span><span>$${money(gst)}</span></div>
        <div class="r"><span>TVQ 9.975%</span><span>$${money(qst)}</span></div>` : ''}
        <div class="r"><span>${applyTaxes ? 'Total avec taxes' : 'Total'}</span><strong style="color:var(--accent-dark);">$${money(total)}</strong></div>
        <div class="r" style="margin-top:6px;border-top:1px solid var(--outline-light);padding-top:6px;">
          <span>Solde après ce paiement</span><strong>$${money(newBalance)}</strong>
        </div>`;
      return { pct: p, preTax, total };
    };

    let last = recompute(currentPct);

    pctEl.addEventListener('input', () => {
      const p = Number(pctEl.value) || 0;
      amtEl.value = (Math.round(base * p) / 100).toFixed(2);
      last = recompute(p);
    });
    amtEl.addEventListener('input', () => {
      const preTax = Number(amtEl.value) || 0;
      const p = base > 0 ? Math.round((preTax / base) * 10000) / 100 : 0;
      pctEl.value = p;
      last = recompute(p);
    });

    const close = (result) => { document.body.removeChild(backdrop); resolve(result); };
    backdrop.querySelector('#adj-cancel').onclick = () => close(null);
    backdrop.querySelector('#adj-skip').onclick   = () => close({ changed: false, pct: currentPct });
    backdrop.querySelector('#adj-ok').onclick     = () => {
      const p = last.pct;
      const changed = Math.abs(p - currentPct) >= 0.005;
      close({ changed, pct: p });
    };
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(null); });
  });
}

// Modal: record a customer payment. Optionally pre-links to an invoice.
function openPaymentModal(preselectInvoiceId) {
  const opts = quote.options || [];
  const accepted = opts.find(o => o.key === quote.accepted_option_key) || opts[0];
  const totalSigned  = accepted ? accepted.total : 0;
  const totalPaid    = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const remaining    = Math.max(0, totalSigned - totalPaid);

  const preselect = preselectInvoiceId
    ? invoices.find(i => i.id === preselectInvoiceId)
    : null;

  // Suggest amount: outstanding on the selected invoice, or full remaining balance.
  const invoicePayments = (invId) => payments.filter(p => p.invoice_id === invId).reduce((s, p) => s + Number(p.amount || 0), 0);
  const defaultAmount = preselect
    ? Math.max(0, Number(preselect.amount_total || 0) - invoicePayments(preselect.id)).toFixed(2)
    : remaining.toFixed(2);

  const today = new Date().toISOString().slice(0, 10);

  const invoiceOptions = invoices
    .filter(i => i.status !== 'cancelled')
    .map(i => {
      const outstanding = Math.max(0, Number(i.amount_total || 0) - invoicePayments(i.id));
      const label = `${i.label || ''} — $${money(i.amount_total)}${outstanding < Number(i.amount_total) ? ` (reste $${money(outstanding)})` : ''}`;
      return `<option value="${i.id}" ${preselect && preselect.id === i.id ? 'selected' : ''}>${esc(label)}</option>`;
    }).join('');

  const backdrop = document.createElement('div');
  backdrop.className = 'adj-backdrop';
  backdrop.innerHTML = `
    <div class="adj-modal" role="dialog" aria-modal="true">
      <div class="adj-title">Enregistrer un paiement</div>
      <div class="adj-sub">Solde restant sur le contrat : <strong>$${money(remaining)}</strong></div>

      <div class="pay-two">
        <div class="pay-field">
          <label>Montant reçu ($)</label>
          <input type="number" id="pay-amount" step="0.01" min="0.01" value="${defaultAmount}" autofocus>
        </div>
        <div class="pay-field">
          <label>Date du paiement</label>
          <input type="date" id="pay-date" value="${today}">
        </div>
      </div>

      <div class="pay-two">
        <div class="pay-field">
          <label>Méthode</label>
          <select id="pay-method">
            <option value="interac">Interac</option>
            <option value="cheque">Chèque</option>
            <option value="card">Carte</option>
            <option value="cash">Comptant</option>
            <option value="other">Autre</option>
          </select>
        </div>
        <div class="pay-field">
          <label>Appliquer à</label>
          <select id="pay-invoice">
            <option value="">— Avance (non liée) —</option>
            ${invoiceOptions}
          </select>
        </div>
      </div>

      <div class="pay-field">
        <label>Note (optionnelle)</label>
        <textarea id="pay-note" placeholder="Numéro de chèque, référence Interac, etc."></textarea>
      </div>

      <div class="adj-preview" id="pay-preview"></div>

      <div class="pay-field" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="pay-send" style="width:auto;margin:0;" checked>
        <label for="pay-send" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text-primary);font-weight:500;">Envoyer un reçu par courriel après l'enregistrement</label>
      </div>

      <div class="adj-actions">
        <button class="btn btn-secondary btn-sm" id="pay-cancel">Annuler</button>
        <button class="btn btn-primary btn-sm" id="pay-ok">Enregistrer</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);

  const amtEl    = backdrop.querySelector('#pay-amount');
  const methodEl = backdrop.querySelector('#pay-method');
  const invEl    = backdrop.querySelector('#pay-invoice');
  const prev     = backdrop.querySelector('#pay-preview');

  const recompute = () => {
    const amt = Math.max(0, Number(amtEl.value) || 0);
    const newPaid = totalPaid + amt;
    const newBal  = Math.max(0, totalSigned - newPaid);
    prev.innerHTML = `
      <div class="r"><span>Payé à ce jour</span><strong>$${money(totalPaid)}</strong></div>
      <div class="r"><span>Ce paiement</span><strong style="color:var(--green);">+$${money(amt)}</strong></div>
      <div class="r" style="margin-top:6px;border-top:1px solid var(--outline-light);padding-top:6px;">
        <span>Nouveau solde</span><strong style="color:var(--accent-dark);">$${money(newBal)}</strong>
      </div>`;
  };
  amtEl.addEventListener('input', recompute);
  recompute();

  // If linked to an invoice, refresh the suggested amount to that invoice's outstanding.
  invEl.addEventListener('change', () => {
    if (!invEl.value) { amtEl.value = remaining.toFixed(2); recompute(); return; }
    const inv = invoices.find(i => i.id === invEl.value);
    if (!inv) return;
    const outstanding = Math.max(0, Number(inv.amount_total || 0) - invoicePayments(inv.id));
    amtEl.value = outstanding.toFixed(2);
    recompute();
  });

  const close = () => document.body.removeChild(backdrop);
  backdrop.querySelector('#pay-cancel').onclick = close;
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });

  backdrop.querySelector('#pay-ok').onclick = async () => {
    const amount = Number(amtEl.value);
    if (!(amount > 0)) { showToast('Montant invalide'); return; }
    const paid_at = backdrop.querySelector('#pay-date').value || today;
    const method  = methodEl.value;
    const invoice_id = invEl.value || null;
    const note    = backdrop.querySelector('#pay-note').value || null;
    const sendAfter = backdrop.querySelector('#pay-send').checked;

    const okBtn = backdrop.querySelector('#pay-ok');
    okBtn.disabled = true;
    okBtn.innerHTML = '<span class="spinner-ring" style="width:12px;height:12px;border-width:2px;"></span> …';
    try {
      const created = await insertPayment({
        project_id: project.id,
        invoice_id,
        customer_id: quote.customer_id || null,
        amount, method, paid_at, note
      });
      // Refresh state
      payments = await listProjectPayments(project.id);
      invoices = await sb.from('invoices').select('*').eq('project_id', project.id).order('sequence').then(r => r.data || []);
      close();
      render();
      showToast('Paiement enregistré');
      if (sendAfter) {
        // Fire-and-forget receipt send
        sendReceipt(created.id, 'email', null).catch(() => {});
      }
    } catch (err) {
      showToast('Erreur : ' + err.message);
      okBtn.disabled = false;
      okBtn.innerHTML = 'Enregistrer';
    }
  };
}

async function sendReceipt(paymentId, channel, btn) {
  const originalHtml = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-ring" style="width:12px;height:12px;border-width:2px;"></span> …';
  }
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-quote', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ payment_id: paymentId, channel })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    payments = await listProjectPayments(project.id);
    render();
    showToast(channel === 'sms' ? `Reçu SMS envoyé à ${data.to}` : `Reçu envoyé à ${data.to}`);
  } catch (err) {
    showToast('Erreur : ' + err.message);
    if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; }
  }
}

async function deletePaymentClick(id) {
  if (!confirm('Supprimer ce paiement ? Le solde sera recalculé.')) return;
  try {
    await deletePayment(id);
    payments = await listProjectPayments(project.id);
    invoices = await sb.from('invoices').select('*').eq('project_id', project.id).order('sequence').then(r => r.data || []);
    render();
    showToast('Paiement supprimé');
  } catch (err) { showToast('Erreur : ' + err.message); }
}

function statusFr(s) {
  return { planning: 'Planification', active: 'En cours', on_hold: 'En pause', completed: 'Terminé', cancelled: 'Annulé' }[s] || s;
}
function invStatusFr(s) {
  return { pending: 'En attente', sent: 'Envoyée', paid: 'Payée', overdue: 'En retard', cancelled: 'Annulée' }[s] || s;
}
function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(n) { return parseFloat(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 2500); }
</script>
